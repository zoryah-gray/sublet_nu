services:
  # Development — hot reload, source mounted from host
  dev:
    image: node:22-alpine
    # Mount the whole workspace (not just apps/frontend) so npm workspace
    # hoisting resolves packages/shared and the root-hoisted node_modules;
    # working_dir just moves where `npm run dev` actually executes from.
    working_dir: /app/apps/frontend
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"

  # Production — optimised multi-stage build
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1


  db:
    image: postgres:17-alpine
    env_file:
      - path: .env.local
        required: false
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
